<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | 자산 파일럿</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<header class="adm-header">
  <span class="adm-brand">자산 파일럿 · 관리자</span>
  <span class="adm-user" id="admUser" hidden></span>
  <button type="button" class="adm-btn adm-btn-ghost" id="admSignOut" hidden>로그아웃</button>
</header>

<main class="adm-wrap">
  <!-- 로그인 전에는 이 카드만 보이며, 관리자 데이터 요청은 일절 하지 않는다. -->
  <section class="adm-card" id="admGate">
    <h1>관리자 로그인</h1>
    <p class="adm-note">관리자 권한이 부여된 Google 계정으로 로그인하세요. 공유 비밀값은 더 이상 사용하지 않습니다.</p>
    <button type="button" class="adm-btn" id="admSignIn">Google 계정으로 로그인</button>
    <p class="adm-result" id="admGateMsg" role="status"></p>
  </section>

  <section id="admApp" hidden>
    <nav class="adm-tabs" id="admTabs">
      <button type="button" class="adm-tab is-active" data-tab="push">푸시 발송</button>
      <button type="button" class="adm-tab" data-tab="calendar">캘린더 일정</button>
      <button type="button" class="adm-tab" data-tab="system">동기화·로그</button>
      <button type="button" class="adm-tab" data-tab="tax">세무 상담 신청</button>
      <button type="button" class="adm-tab" data-tab="lounge">라운지 관리</button>
    </nav>

    <section class="adm-card" data-panel="push">
      <h2>푸시 알림 발송</h2>
      <label class="adm-label" for="pushTitle">제목 (60자 이내)</label>
      <input class="adm-input" id="pushTitle" maxlength="60" autocomplete="off">
      <label class="adm-label" for="pushBody">내용 (200자 이내)</label>
      <textarea class="adm-input adm-textarea" id="pushBody" maxlength="200"></textarea>
      <label class="adm-label" for="pushLink">이동 링크 (선택: calendar / lounge / mypage 등)</label>
      <input class="adm-input" id="pushLink" maxlength="60" autocomplete="off">
      <label class="adm-label" for="pushSchedule">예약 발송 시각 (선택, 비우면 즉시 발송)</label>
      <input class="adm-input" id="pushSchedule" type="datetime-local">
      <button type="button" class="adm-btn" id="pushSubmit">발송하기</button>
      <p class="adm-result" id="pushResult" role="status"></p>
    </section>

    <section class="adm-card" data-panel="calendar" hidden>
      <h2 id="calFormTitle">캘린더 일정 등록</h2>
      <input type="hidden" id="calEditId">
      <label class="adm-label" for="calCategory">카테고리</label>
      <select class="adm-input" id="calCategory">
        <option value="subsidy">정부지원금</option>
        <option value="realestate">부동산 청약</option>
        <option value="ipo">공모주 / 증시</option>
        <option value="stock">주식</option>
        <option value="tax">세금</option>
        <option value="economy">경제</option>
      </select>
      <label class="adm-label" for="calDate">날짜 (D-Day 기준일)</label>
      <input class="adm-input" id="calDate" type="date">
      <label class="adm-label" for="calTitle">제목 (80자 이내)</label>
      <input class="adm-input" id="calTitle" maxlength="80" autocomplete="off">
      <label class="adm-label" for="calMeta">부제 / 요약 (선택)</label>
      <input class="adm-input" id="calMeta" maxlength="120" autocomplete="off">
      <label class="adm-label" for="calStatus">상태 (선택)</label>
      <select class="adm-input" id="calStatus">
        <option value="">없음</option><option value="예정">예정</option><option value="확정">확정</option>
        <option value="변경">변경</option><option value="연기">연기</option><option value="취소">취소</option><option value="종료">종료</option>
      </select>
      <label class="adm-label" for="calFlag">국가</label>
      <select class="adm-input" id="calFlag"><option value="kr">한국</option><option value="us">미국</option></select>
      <label class="adm-label" for="calLink">신청 / 원문 링크 (선택, http(s)만)</label>
      <input class="adm-input" id="calLink" maxlength="500" autocomplete="off">
      <details class="adm-details">
        <summary>상세 항목 (카테고리별, 선택)</summary>
        <label class="adm-label" for="calEligibility">신청 자격 요건 (정부지원금)</label>
        <input class="adm-input" id="calEligibility" maxlength="300" autocomplete="off">
        <label class="adm-label" for="calApplyPeriod">신청 기간 (정부지원금)</label>
        <input class="adm-input" id="calApplyPeriod" maxlength="300" autocomplete="off">
        <label class="adm-label" for="calSupplyType">공급 유형 (청약)</label>
        <input class="adm-input" id="calSupplyType" maxlength="300" autocomplete="off">
        <label class="adm-label" for="calWinnerDate">당첨자 발표일 (청약)</label>
        <input class="adm-input" id="calWinnerDate" maxlength="300" autocomplete="off">
        <label class="adm-label" for="calUnderwriter">주관 증권사 (공모주)</label>
        <input class="adm-input" id="calUnderwriter" maxlength="300" autocomplete="off">
        <label class="adm-label" for="calOfferPrice">공모가 (공모주)</label>
        <input class="adm-input" id="calOfferPrice" maxlength="300" autocomplete="off">
        <label class="adm-label" for="calRefundDate">환불일 (공모주)</label>
        <input class="adm-input" id="calRefundDate" maxlength="300" autocomplete="off">
        <label class="adm-label" for="calListingDate">상장일 (공모주)</label>
        <input class="adm-input" id="calListingDate" maxlength="300" autocomplete="off">
      </details>
      <label class="adm-label" for="calImportance">중요도 override</label>
      <select class="adm-input" id="calImportance">
        <option value="">자동 규칙 사용(설정 안 함)</option><option value="매우중요">매우중요</option><option value="중요">중요</option><option value="일반">일반</option>
      </select>
      <label class="adm-label" for="calDescription">초보자용 설명 override (200자 이내)</label>
      <input class="adm-input" id="calDescription" maxlength="200" autocomplete="off">
      <label class="adm-check"><input type="checkbox" id="calHidden"> 사용자 화면에서 숨기기(삭제 아님)</label>
      <div class="adm-row">
        <button type="button" class="adm-btn" id="calSubmit">등록하기</button>
        <button type="button" class="adm-btn adm-btn-ghost" id="calCancel" hidden>수정 취소</button>
      </div>
      <p class="adm-result" id="calResult" role="status"></p>
      <h3>최근 일정 (30건)</h3>
      <div id="calList"></div>
    </section>

    <section class="adm-card" data-panel="system" hidden>
      <h2>수동 동기화</h2>
      <div class="adm-row">
        <button type="button" class="adm-btn" id="syncCalendarBtn">캘린더(DART·청약홈) 동기화</button>
        <button type="button" class="adm-btn" id="syncIpoBtn">공모주 캐시 갱신</button>
        <button type="button" class="adm-btn" id="syncEconBtn">경제지표 동기화</button>
      </div>
      <p class="adm-result" id="syncResult" role="status"></p>
      <h3>검수 필요 일정</h3>
      <div id="reviewList"></div>
      <h3>동기화 로그 (최근 20건)</h3>
      <div id="logList"></div>
      <h3>경제지표 스냅샷</h3>
      <div id="indicatorList"></div>
    </section>

    <section class="adm-card" data-panel="tax" hidden>
      <h2>세무 상담 신청 목록</h2>
      <p class="adm-note">연락처 등 개인정보가 포함됩니다. 화면 공유·캡처 시 주의하세요.</p>
      <button type="button" class="adm-btn" id="taxLoad">불러오기</button>
      <p class="adm-result" id="taxResult" role="status"></p>
      <div id="taxList"></div>
    </section>

    <section class="adm-card" data-panel="lounge" hidden>
      <h2>자산 라운지 관리</h2>
      <p class="adm-note">신고된 글·댓글을 삭제하거나 작성자를 차단합니다.</p>
      <button type="button" class="adm-btn" id="loungeLoad">신고된 글·댓글 불러오기</button>
      <p class="adm-result" id="loungeResult" role="status"></p>
      <div id="loungeList"></div>
      <label class="adm-label" for="loungeUid">사용자 uid</label>
      <input class="adm-input" id="loungeUid" autocomplete="off">
      <div class="adm-row">
        <button type="button" class="adm-btn" id="loungeBan">차단</button>
        <button type="button" class="adm-btn adm-btn-ghost" id="loungeUnban">차단 해제</button>
      </div>
    </section>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
